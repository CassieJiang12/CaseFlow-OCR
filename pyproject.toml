[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caseflow-ocr"
version = "0.1.0"
description = "OCR and structured field extraction for scanned legal documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "python-dotenv>=1,<2",
  "openai>=2,<3", "pytesseract>=0.3.13,<1", "pypdfium2>=4.30,<6", "Pillow>=11,<14"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: exercises the installed Tesseract binary"]

